<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
  <title>Elo- Sign in</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-[Montserrat]">

  <div class="bg-white p-4 rounded-2xl shadow-lg w-full max-w-sm ">
    <div class="flex justify-center mb-6">
      <a href="#">
        <img src="eloo_dccdad5c-7aa6-4916-bdb9-6e9d11089798.avif" alt="Elo Logo" class="h-12 w-auto" />
      </a>
    </div>

    <h1 class="text-2xl font-bold mb-2 text-left">Sign in</h1>
    <p class="text-gray-600 mb-6 text-sm">Enter your email and we'll send you a verification code</p>

    <input type="email" name="email" id="email" placeholder="email"
      class="w-full border border-gray-300 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-black">

    <button class="w-full bg-black text-white py-2 rounded-lg mb-2 hover:bg-gray-800 transition">
      <b>Continue</b>
    </button>
     <div class="text-sm flex justify-evenly" >
    <p>privacy policy</p>
    <p>Terms of service</p>
  </div>
  </div>
 

</body>
</html>
